<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linhas de Transporte</title>
    <link rel="stylesheet" href="../css/gestao.css">
</head>

<body>
    <div class="container-fluid">
        <div class="mapa">
            <img
                src="https://www.cnnbrasil.com.br/wp-content/uploads/sites/12/2024/02/google-maps-e1707316052388.png?w=1200&h=900&crop=1">
        </div>

        <div class="linhas">
            <h2>Linhas</h2>

            <div class="linha-container" data-linha="amarela">
                <div class="linha-nome amarela">Linha Amarela</div>
                <div class="status">
                    <span class="status-text">Ativa</span>
                    <span class="status-indicator ativa"></span>
                </div>
            </div>

            <div class="linha-container" data-linha="azul">
                <div class="linha-nome azul">Linha Azul</div>
                <div class="status">
                    <span class="status-text">Ativa</span>
                    <span class="status-indicator ativa"></span>
                </div>
            </div>

            <div class="linha-container" data-linha="verde">
                <div class="linha-nome verde">Linha Verde</div>
                <div class="status">
                    <span class="status-text">Ativa</span>
                    <span class="status-indicator ativa"></span>
                </div>
            </div>

            <div class="linha-container" data-linha="vermelha">
                <div class="linha-nome vermelha">Linha Vermelha</div>
                <div class="status">
                    <span class="status-text">Ativa</span>
                    <span class="status-indicator ativa"></span>
                </div>

            </div>
        </div>

        <div class="flex">
            <div class="container">
                <div class="card">
                    <h2>Trens em Manutenção</h2>
                    <div class="status-number">4 trens estão em manutenção</div>
                    <a href="detalhes.html" class="btn-ver">Clique para visualizar</a>
                </div>

                <div class="card alertas">
                    <h2>Alerta</h2>
                    <div id="alert-message">Não há alertas no momento.</div>
                    <div id="alert-time"></div>
                </div>
            </div>
        </div>


        <script src="../js/gestao.js"></script>
</body>

</html>
